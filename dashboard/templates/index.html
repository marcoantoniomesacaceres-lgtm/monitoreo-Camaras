<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISMONICAMARAS Dashboard</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

  <style>
    canvas { border: 2px solid #333; border-radius: 8px; margin-top: 10px; max-width: 100%; }
    #status { margin: 15px; font-weight: bold; }
    button.logout { margin-top: 15px; padding: 10px 20px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button.logout:hover { background: #a71d2a; }
    header { text-align: center; margin: 20px 0; }
  </style>
</head>
<body class="bg-light">
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Dashboard</span>
      <button class="btn btn-outline-light" onclick="logout()">Salir</button>
    </div>
  </nav>

  <!-- Encabezado -->
  <header>
    <h1>HI - TECH PEOPLE SAS</h1>
    <h2>Sistema de Monitoreo de Cámaras</h2>
    <h4>Bienvenido, <span id="username">Usuario</span></h4>
  </header>

  <div class="container">
    <!-- Controles de la cámara -->
    <section class="camera-control mb-4">
      <h3>📷 Cámara en Tiempo Real</h3>
      <button id="toggleCameraBtn" class="btn btn-primary" onclick="toggleCamera()">Video en vivo</button>
      <p id="status">Cargando cámara...</p>
      <canvas id="videoCanvas" width="640" height="480"></canvas><br>
    </section>

    <!-- Estado -->
    <section class="status mb-4">
      <h3>📊 Estado Actual</h3>
      <p><strong>Personas dentro:</strong> <span id="inside">0</span></p>
      <p><strong>Total Entradas:</strong> <span id="entered">0</span></p>
      <p><strong>Total Salidas:</strong> <span id="exited">0</span></p>
      <p><strong>Estado de Cámara:</strong> <span id="cameraStatus" class="status-offline">Fuera de línea</span></p>
    </section>

    <!-- Tiempos de permanencia -->
    <section class="durations mb-4">
      <h3>⏱️ Tiempos de Permanencia</h3>
      <div id="durations"></div>
    </section>

    <!-- Reportes -->
    <section class="reports mb-4">
      <h3>📑 Reportes</h3>
      <button class="btn btn-outline-secondary" onclick="window.location.href='/reports/daily'">Reporte Diario</button>
      <button class="btn btn-outline-secondary" onclick="window.location.href='/reports/weekly'">Reporte Semanal</button>
      <button class="btn btn-outline-secondary" onclick="window.location.href='/reports/monthly'">Reporte Mensual</button>
    </section>
  </div>

  <script>
    async function fetchProtectedData() {
      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "/login";
        return;
      }

      // Puedes hacer una petición protegida para validar el token si lo deseas
      // Si falla, limpiar token y redirigir a login
      const response = await fetch("/status", {
        headers: { "Authorization": `Bearer ${token}` },
      });
      if (!response.ok) {
        localStorage.removeItem("token");
        window.location.href = "/login";
      }
    }

    function logout() {
      localStorage.removeItem("token");
      // Borrar cookie access_token (expirándola)
      document.cookie = "access_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
      window.location.href = "/login";
    }

    function traducirEstado(estado) {
      switch (estado.toLowerCase()) {
        case "online": return "En línea";
        case "offline": return "Fuera de línea";
        case "reconnecting": return "Reconectando...";
        default: return estado;
      }
    }

    function actualizarEstadoCamera(estado) {
      const cameraStatus = document.getElementById("cameraStatus");
      cameraStatus.textContent = traducirEstado(estado);
      cameraStatus.className = "";
      if (estado.toLowerCase() === "online") cameraStatus.classList.add("status-online");
      if (estado.toLowerCase() === "offline") cameraStatus.classList.add("status-offline");
      if (estado.toLowerCase() === "reconnecting") cameraStatus.classList.add("status-reconnecting");
    }

    async function updateStatus() {
      try {
        const token = localStorage.getItem("token");
        if (!token) return;

        const res = await fetch("/status", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();

  document.getElementById("username").innerText = data.user || data.username || "Invitado";
        document.getElementById("inside").innerText = data.inside ?? 0;
        document.getElementById("entered").innerText = data.entered ?? 0;
        document.getElementById("exited").innerText = data.exited ?? 0;
        actualizarEstadoCamera(data.camera_status ?? "offline");
      } catch (e) {
        console.error("❌ Error obteniendo estado:", e);
      }
    }

    async function toggleCamera() {
      try {
        const token = localStorage.getItem("token");
        const res = await fetch("/toggle_camera", {
          method: "POST",
          headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        actualizarEstadoCamera(data.camera_status ?? "offline");

        if (data.camera_active) {
          startStream();
        } else {
          stopStream();
        }
      } catch (e) {
        console.error("❌ Error alternando cámara:", e);
      }
    }

    async function updateDurations() {
      try {
        const token = localStorage.getItem("token");
        const res = await fetch("/durations", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        let html = "";
        for (const [id, seconds] of Object.entries(data)) {
          html += `<p>Persona ${id}: ${Math.round(seconds)} segundos</p>`;
        }
        document.getElementById("durations").innerHTML = html;
      } catch (e) {
        console.error("❌ Error obteniendo tiempos de permanencia:", e);
      }
    }

    const canvas = document.getElementById("videoCanvas");
    const ctx = canvas?.getContext("2d");
    let readerController = null;

    async function startStream() {
      const token = localStorage.getItem("token");
      if (!token) {
        document.getElementById("status").textContent = "⚠️ No hay token, inicia sesión primero.";
        return setTimeout(() => window.location.href = "/dashboard", 1000);
      }

      try {
        const response = await fetch("/video", {
          headers: { "Authorization": `Bearer ${token}` }
        });

        if (!response.ok) {
          document.getElementById("status").textContent = "❌ Error accediendo al stream: " + response.status;
          return;
        }

        const reader = response.body.getReader();
        readerController = reader;
        let buffer = new Uint8Array();

        function readChunk({ done, value }) {
          if (done) return;
          if (value) {
            const tmp = new Uint8Array(buffer.length + value.length);
            tmp.set(buffer, 0);
            tmp.set(value, buffer.length);
            buffer = tmp;

            const jpegStart = buffer.indexOf(0xff);
            const jpegEnd = buffer.lastIndexOf(0xd9);
            if (jpegStart !== -1 && jpegEnd !== -1) {
              const frameData = buffer.slice(jpegStart, jpegEnd + 1);
              const blob = new Blob([frameData], { type: "image/jpeg" });
              const img = new Image();
              img.onload = function () {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              };
              img.src = URL.createObjectURL(blob);
              buffer = buffer.slice(jpegEnd + 2);
            }
          }
          reader.read().then(readChunk);
        }

        reader.read().then(readChunk);
        document.getElementById("status").textContent = "✅ Cámara en línea";
      } catch (err) {
        console.error("Stream error:", err);
        document.getElementById("status").textContent = "❌ Error conectando al stream";
      }
    }

    function stopStream() {
      if (readerController) {
        readerController.cancel();
        readerController = null;
        document.getElementById("status").textContent = "⏹️ Stream detenido";
      }
    }

    fetchProtectedData();
    setInterval(updateStatus, 2000);
    setInterval(updateDurations, 5000);
    window.onload = function () {
      updateStatus();
      updateDurations();
    };
  </script>
</body>
</html>
