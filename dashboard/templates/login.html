<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4" style="width: 350px;">
    <h3 class="text-center mb-4">Iniciar Sesión</h3>
    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">Usuario</label>
        <input type="text" class="form-control" id="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
    <div id="message" class="mt-3 text-center text-danger"></div>
  </div>

  <script>

    // Si ya hay token, validar con el backend antes de redirigir
    async function validarTokenYRedirigir() {
      const token = localStorage.getItem("token");
      if (!token) return;
      try {
        const res = await fetch("/status", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (res.ok) {
          window.location.href = "/dashboard";
        } else {
          localStorage.removeItem("token");
        }
      } catch (e) {
        localStorage.removeItem("token");
      }
    }
    validarTokenYRedirigir();

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ username, password }),
        });

        const data = await response.json();
        if (response.ok && data.access_token) {
          // ✅ Guardamos el token en localStorage
          localStorage.setItem("token", data.access_token);

          // Mensaje de éxito y redirección al dashboard
          document.getElementById("message").classList.remove("text-danger");
          document.getElementById("message").classList.add("text-success");
          document.getElementById("message").textContent = "¡Login exitoso!";
          setTimeout(() => window.location.href = "/dashboard", 800);
        } else {
          document.getElementById("message").textContent = data.detail || "Error al iniciar sesión";
        }
      } catch (err) {
        document.getElementById("message").textContent = "⚠️ Error de conexión con el servidor";
      }
    });
  </script>
</body>
</html>
